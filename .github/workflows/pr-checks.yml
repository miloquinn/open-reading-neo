name: PR checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  flutter-validation:
    name: Core Flutter validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prepare QuickJS runtime for tests
        shell: bash
        run: |
          quickjs_dir="${PUB_CACHE}/hosted/pub.dev/flutter_js-0.8.7/linux/shared"
          test -f "${quickjs_dir}/libquickjs_c_bridge_plugin.so"
          echo "LD_LIBRARY_PATH=${quickjs_dir}:${LD_LIBRARY_PATH:-}" >> "${GITHUB_ENV}"

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Verify generated localizations are current
        run: git diff --exit-code -- lib/l10n

      - name: Verify generated changelog is current
        run: |
          python3 -m unittest discover -s test -p 'test_*.py'
          python3 tool/generate_changelog.py --check

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze source
        # Keep existing warnings visible without making them fatal. Analyzer
        # errors still fail the job.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Validate QuickJS source compatibility
        run: flutter test test/source_script_engine_test.dart test/source_script_compatibility_test.dart

      - name: Run tests with coverage
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' test_files < <(
            find test -type f -name '*_test.dart' \
              ! -name 'book_source_management_page_test.dart' \
              ! -name 'book_source_management_organization_test.dart' \
              ! -name 'book_source_reader_page_test.dart' \
              ! -name 'book_source_discovery_page_test.dart' \
              ! -name 'native_reader_auto_page_turn_test.dart' \
              ! -name 'native_reader_txt_title_page_test.dart' \
              ! -name 'native_reader_epub_chapter_transition_test.dart' \
              ! -name 'native_reader_initial_progress_test.dart' \
              ! -name 'source_response_codec_test.dart' \
              -print0
          )
          flutter test --coverage --exclude-tags isolated-process "${test_files[@]}"

      - name: Run stateful reader tests in isolated processes
        shell: bash
        run: |
          set -euo pipefail
          # These widget suites own process-global preferences, controllers,
          # image codecs, and platform channels. Running one case per process
          # keeps a framework leak from looking like an application failure.
          management_tests=(
            'keeps native ORSP source management available'
            'uses one add flow regardless of the advanced toggle'
            'keeps dense source metadata readable on narrow phones'
            'groups connected sources by protocol'
            'adding a source requires explicit third-party acknowledgment'
            'selection mode exposes bulk source actions'
            'shows operator-supplied rights metadata as unverified'
            'large source collections build lazily and remain searchable'
          )
          for test_name in "${management_tests[@]}"; do
            flutter test test/book_source_management_page_test.dart \
              --plain-name "$test_name"
          done

          organization_tests=(
            'favorite and single-source group controls work on a narrow screen'
            'bulk grouping retains selection and empty folders remain filterable'
          )
          for test_name in "${organization_tests[@]}"; do
            flutter test test/book_source_management_organization_test.dart \
              --plain-name "$test_name"
          done

          # Native auto-turn cases own timers, platform controllers, EPUB
          # isolates, and process-global reader state. The final EPUB case is
          # deterministic alone but can inherit unfinished asynchronous work
          # from the earlier ten cases, so keep every assertion in a fresh VM.
          native_auto_turn_tests=(
            'starts auto page turn from paging settings and advances a page'
            'opening reader controls pauses auto page turn'
            'backgrounding pauses auto page turn without automatic resume'
            'auto page turn stops when the last page is reached'
            'auto page turn advances across an EPUB chapter boundary'
            'auto page turn scrolls a vertical reader by one viewport'
            'sweep uses the ten second default and resumes from a paused midpoint'
            'two-page sweep scans both leaves before committing the spread'
            'continuous mode scrolls smoothly with chapter paging enabled'
            'dragging takes over a smooth continuous pause immediately'
            'continuous mode crosses an EPUB chapter without changing mode'
          )
          for test_name in "${native_auto_turn_tests[@]}"; do
            flutter test test/native_reader_auto_page_turn_test.dart \
              --plain-name "$test_name"
          done

          # Native reader suites share asynchronous disposal and platform state.
          # Keep all cases active while giving each a fresh process.
          native_txt_tests=(
            'native TXT replacement rules clean title and content'
            'TXT chapter title is a dedicated first page'
            'native open failure keeps the seeded reader theme background'
            'disabled TXT title page places the heading above body text'
            'opening placeholder uses the seeded reader theme'
            'waits for reader font restoration before revealing text'
            'vertical paging preserves the dedicated TXT chapter title page'
            'horizontal TOC jump mounts the target title on the first frame and keeps the previous page ready'
            'TXT horizontal paging keeps its legacy delegate stable during a chapter turn'
            'TXT initialization preloads behind the cover route'
          )
          for test_name in "${native_txt_tests[@]}"; do
            flutter test test/native_reader_txt_title_page_test.dart \
              --plain-name "$test_name"
          done

          native_epub_tests=(
            'EPUB precaches adjacent horizontal images before the first turn'
            'EPUB horizontal turns warm the next pagination window before a chapter boundary'
            'EPUB horizontal paging continues past image-only front matter'
            'EPUB horizontal paging does not bounce when turning again at a warming tail'
            'EPUB backward turns keep one horizontal controller'
            'EPUB page curl returns from a chapter first page to the previous last page'
          )
          for test_name in "${native_epub_tests[@]}"; do
            flutter test test/native_reader_epub_chapter_transition_test.dart \
              --plain-name "$test_name"
          done

          native_progress_tests=(
            'EPUB horizontal reader paints the restored page on its first frame'
            'EPUB continuous scroll hides the chapter opening until restore completes'
            'EPUB system back persists the pending horizontal page before reopening'
          )
          for test_name in "${native_progress_tests[@]}"; do
            flutter test test/native_reader_initial_progress_test.dart \
              --plain-name "$test_name"
          done

          # The image-reader case deliberately leaves a page load pending so
          # it can assert the reader shell before image decoding. Run the
          # remaining stateful source-reader cases separately to keep that
          # fixture from holding Flutter's combined test process open.
          reader_tests=(
            'image-only source chapters open in the paged image reader'
            'cover opening skips a brief loader and fades directly to content'
            'a genuinely slow opening never overlaps loader and content'
            'loads source chapters and navigates to the next chapter'
            'automatic page turning advances source text and pauses on touch'
            'automatic page turning advances a vertical source viewport'
            'automatic page turning stops at the end of a source book'
            'source sweep uses ten seconds and resumes its reveal'
            'source continuous scroll preserves chapter preference and pauses'
            'source continuous scroll crosses chapters without changing its layout preference'
            'replacement rules clean source chapter titles and content'
            'restores the last source chapter on reopen'
            'uses the shared reader settings with independent margins'
            'naturally aligns source body text in verticalScroll mode'
            'naturally aligns source body text in instantPage mode'
            'applies persisted source alignment and letter spacing'
            'vertical source text keeps its natural continuous height'
            'tablet source page curl uses two leaves and a subtle center divider'
            'tablet source reader can disable the two-page layout'
            'tablet spread progress tracks the last visible page and restores its left page'
            'next chapter preview is ready even while a farther prefetch is pending'
            'prefetched chapter turn does not wait for progress persistence'
            'horizontal slide commits a prefetched chapter only after the animation settles'
            'horizontal slide lets a new drag take over a cross-chapter settle'
            'tablet forward chapter curl uses prefetched page one at half-page width without refetching'
            'tablet forward chapter curl previews title and body leaves for a short chapter'
            'tablet backward chapter curl targets the previous final spread left page'
            'uses the light reader theme for status bar icon contrast'
            'uses the dark reader theme for status bar icon contrast'
            'system reader theme uses a solid pure-black status bar without glass'
          )
          for test_name in "${reader_tests[@]}"; do
            flutter test test/book_source_reader_page_test.dart \
              --plain-name "$test_name"
          done

          # Discovery tests use animated reveal controllers and shared source
          # registries. Isolate each case so a pending animation or registry
          # mutation cannot make later pumpAndSettle calls time out.
          discovery_tests=(
            'favorite then create and select a group without leaving discovery'
            'list favorite keeps expanded channels and filters with an undoable removal'
            'discover scope defaults to all and filters every section'
            'reading source scope shows channels without ORSP tabs'
            'rapid source and layout changes settle on the newest view'
            'latest aggregation interleaves sources and caps each contribution'
            'pull to refresh invalidates cached responses before reloading'
            'pull to refresh keeps content instead of showing another loader'
            'discover layout preference is restored by a new controller'
            'list layout expands one source and focuses the chosen channel'
            'list layout ignores duplicate channel ids from a source'
            'list layout searches sources and expands the first match'
            'list source search stays fixed while the directory scrolls'
            'list category selection starts below the header and restores directory scroll'
            'large source libraries start scoped and build source chips lazily'
            'cross-source discovery uses bounded concurrency'
            'request failures are not reported as unsupported capabilities'
            'channel request failures stay visible and can be retried'
            'an empty capable source shows an empty state'
            'missing capabilities still show the unsupported state'
            'large category sets use a searchable lazy picker'
            'list layout lazily builds large expanded channel sets'
            'discovery shelves are built lazily along the vertical viewport'
            'details sheet keeps its drag handle below the top safe area'
            'switching to shelf options smoothly shrinks the existing sheet'
            'adding online stays in the details sheet for feedback then closes'
            'an existing shelf book uses an information state without drop'
            'a failed online add keeps the sheet open for retry'
            'local download progress stays in the sheet and can continue'
            'reading from the details sheet hands off to paper transition'
          )
          for test_name in "${discovery_tests[@]}"; do
            flutter test test/book_source_discovery_page_test.dart \
              --plain-name "$test_name"
          done

          # This discovery/search case inherits animated controllers from
          # earlier cases in the same Dart VM. Its assertions are kept active
          # in a fresh process, where it is deterministic.
          flutter test test/book_source_search_page_test.dart \
            --plain-name 'discover page selects a reading source, channel, and next page'

      - name: Explain validation failures
        if: ${{ failure() }}
        run: |
          echo '::error title=Flutter validation failed::Core tests and stateful widget tests are separate steps. Check the failing step name before treating this as a build failure.'

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flutter-coverage-${{ github.sha }}
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  response-codec:
    name: Core Flutter validation / response codec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Validate response codecs in an isolated process
        shell: bash
        run: |
          set -euo pipefail
          # GBK initializes large Dart map literals. Give the Linux test VM
          # more stack while keeping every codec assertion enabled.
          ulimit -s 65536
          flutter test test/source_response_codec_test.dart --reporter expanded

  build-smoke:
    name: Product build / ${{ matrix.name }}
    needs: [flutter-validation, response-codec]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android debug APK
            command: flutter build apk --debug
            advisory: false
          - name: Web release
            command: flutter build web --release
            # Web currently exposes third-party and 64-bit integer JavaScript
            # compatibility gaps. Keep the signal visible without blocking PRs.
            advisory: true

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build ${{ matrix.name }}
        run: ${{ matrix.command }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
