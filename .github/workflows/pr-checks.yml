name: PR checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  flutter-validation:
    name: Flutter validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prepare QuickJS runtime for tests
        shell: bash
        run: |
          quickjs_dir="${PUB_CACHE}/hosted/pub.dev/flutter_js-0.8.7/linux/shared"
          test -f "${quickjs_dir}/libquickjs_c_bridge_plugin.so"
          echo "LD_LIBRARY_PATH=${quickjs_dir}:${LD_LIBRARY_PATH:-}" >> "${GITHUB_ENV}"

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Verify generated localizations are current
        run: git diff --exit-code -- lib/l10n

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze source
        # Keep existing warnings visible without making them fatal. Analyzer
        # errors still fail the job.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests with coverage
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' test_files < <(
            find test -type f -name '*_test.dart' \
              ! -name 'book_source_management_page_test.dart' \
              -print0
          )
          flutter test --coverage "${test_files[@]}"

          # This file mutates SharedPreferences-backed registry state across
          # several widget trees. Flutter's combined test process can leave
          # the sixth case waiting until the 10-minute per-test timeout, while
          # every case completes immediately in a fresh process. Keep all
          # assertions in the gate and isolate only this known stateful file.
          management_tests=(
            'keeps native ORSP source management available'
            'uses one add flow regardless of the advanced toggle'
            'keeps dense source metadata readable on narrow phones'
            'groups connected sources by protocol'
            'adding a source requires explicit third-party acknowledgment'
            'selection mode exposes bulk source actions'
            'shows operator-supplied rights metadata as unverified'
            'large source collections build lazily and remain searchable'
          )
          for test_name in "${management_tests[@]}"; do
            flutter test test/book_source_management_page_test.dart \
              --plain-name "$test_name"
          done

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flutter-coverage-${{ github.sha }}
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  build-smoke:
    name: Build smoke / ${{ matrix.name }}
    needs: flutter-validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android debug APK
            command: flutter build apk --debug
            advisory: false
          - name: Web release
            command: flutter build web --release
            # Web currently exposes third-party and 64-bit integer JavaScript
            # compatibility gaps. Keep the signal visible without blocking PRs.
            advisory: true

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build ${{ matrix.name }}
        run: ${{ matrix.command }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
